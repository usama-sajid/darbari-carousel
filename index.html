<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DARBARI Carousel</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111318; color: #fff; }
      main { width: min(680px, calc(100% - 40px)); }
      h1 { color: #ffd166; letter-spacing: .08em; }
      a { color: #ff796c; }
      code { background: #24272e; padding: 3px 7px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>DARBARI</h1>
      <p>This GitHub Pages site hosts the music player's dynamic featured carousel.</p>
      <p>Edit <a href="featured.json">featured.json</a> to reorder cards, change text or images, and enable sponsored cards without rebuilding the app.</p>
    </main>
  </body>
</html>
